name: Deploy website
# Publishes apps/site to https://camasuvi.net/readability/ (Cloudflare Workers static assets).
on:
  push:
    branches: [main]
    paths: ["apps/site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://camasuvi.net/readability/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/site build
      - run: pnpm -C apps/site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live page
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null https://camasuvi.net/readability/
